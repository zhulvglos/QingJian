<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>轻笺快捷标签</title>
  </head>
  <body>
    <main id="root">
      <button id="quick-tab" type="button" aria-label="展开快捷标签，也可拖入内容固定" aria-expanded="false"><span aria-hidden="true">✦</span><strong>拖入固定</strong></button>
      <section id="quick-panel" aria-label="快捷标签" hidden>
        <div id="pin-list" aria-label="已固定内容"></div>
        <p id="quick-empty">拖入便签或笔记<br />即可固定在这里</p>
        <p id="quick-error" role="alert" hidden></p>
        <div id="pin-menu" hidden><button type="button" id="pin-remove">移除固定</button></div>
      </section>
      <div id="quick-drop-hint" aria-live="polite"><span aria-hidden="true">＋</span><strong>松开以固定</strong></div>
    </main>
    <script type="module" src="/src/quick.ts"></script>
  </body>
</html>
